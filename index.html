<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Solar del Amor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: radial-gradient(circle at center, #21134d 0%, #0b0825 45%, #02010d 100%);
    color: white;
    font-family: Arial, sans-serif;
}

/* =========================
   ESTRELLAS
========================= */

.stars {
    position: fixed;
    inset: 0;
    z-index: 0;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle linear infinite;
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0.2;
    }

    50% {
        opacity: 1;
    }
}

/* =========================
   SISTEMA SOLAR
========================= */

.solar-system {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center;
    transition: transform 0.5s ease;
    z-index: 2;
}

/* =========================
   CORAZÓN CENTRAL
========================= */

.sun {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    z-index: 100;
}

.heart {
    position: absolute;
    left: -55px;
    top: -55px;
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, #ff8ab5, #ff245f);
    transform: rotate(45deg);
    border-radius: 8px;
    box-shadow:
        0 0 25px rgba(255, 90, 150, 0.8),
        0 0 60px rgba(255, 40, 100, 0.55),
        0 0 110px rgba(255, 40, 100, 0.25);
    animation: heartPulse 1.8s ease-in-out infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: inherit;
}

.heart::before {
    top: -55px;
    left: 0;
}

.heart::after {
    top: 0;
    left: 55px;
}

@keyframes heartPulse {
    0%, 100% {
        transform: rotate(45deg) scale(1);
    }

    50% {
        transform: rotate(45deg) scale(1.12);
    }
}

/* =========================
   CORAZONCITOS
========================= */

.mini-heart {
    position: absolute;
    font-size: 18px;
    color: #ff80aa;
    text-shadow: 0 0 10px #ff4d88;
    opacity: 0;
    animation: miniFloat 5s infinite ease-in-out;
    pointer-events: none;
}

.mini-heart:nth-child(2) {
    left: -100px;
    top: -20px;
    animation-delay: 0s;
}

.mini-heart:nth-child(3) {
    left: 40px;
    top: -120px;
    animation-delay: 1s;
}

.mini-heart:nth-child(4) {
    left: 100px;
    top: 20px;
    animation-delay: 2s;
}

.mini-heart:nth-child(5) {
    left: -40px;
    top: 100px;
    animation-delay: 3s;
}

@keyframes miniFloat {
    0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.5);
    }

    25% {
        opacity: 1;
    }

    70% {
        opacity: 1;
        transform: translate(var(--x, 20px), var(--y, -60px)) scale(1);
    }

    100% {
        opacity: 0;
        transform: translate(var(--x, 40px), var(--y, -100px)) scale(0.6);
    }
}

/* =========================
   ÓRBITAS
========================= */

.orbit {
    position: absolute;
    left: 0;
    top: 0;
    border: 1px solid rgba(255, 255, 255, 0.13);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* =========================
   PLANETAS
========================= */

.planet-orbit {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    transform-origin: center;
    animation: orbit linear infinite;
}

.planet {
    position: absolute;
    width: var(--size);
    height: var(--size);
    left: calc(var(--size) / -2);
    top: calc(var(--size) / -2);
    margin-left: var(--radius);
    border-radius: 50%;
    background: var(--planet-color);
    box-shadow:
        0 0 8px var(--planet-color),
        0 0 20px var(--planet-color);
    cursor: pointer;
    transition: transform 0.3s ease;
}

.planet:hover {
    transform: scale(1.5);
}

@keyframes orbit {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

/* =========================
   NOMBRE DEL PLANETA
========================= */

.planet-name {
    position: absolute;
    left: 50%;
    top: -32px;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 5px 9px;
    border-radius: 10px;
    font-size: 11px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}

.planet:hover .planet-name {
    opacity: 1;
}

/* =========================
   FRASES FLOTANTES
========================= */

.floating-phrase {
    position: fixed;
    color: rgba(255, 255, 255, 0.65);
    font-size: 14px;
    width: 140px;
    text-align: center;
    text-shadow: 0 0 10px rgba(255, 150, 200, 0.7);
    pointer-events: none;
    animation: floatingText linear infinite;
    z-index: 3;
}

@keyframes floatingText {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-100px);
    }
}

/* =========================
   ESTRELLAS FUGACES
========================= */

.shooting-star {
    position: fixed;
    font-size: 14px;
    font-weight: bold;
    pointer-events: none;
    z-index: 20;
    text-shadow: 0 0 12px currentColor;
    animation: shooting 5s linear forwards;
}

@keyframes shooting {
    0% {
        opacity: 0;
        transform: translate(0, 0);
    }

    10% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translate(var(--tx), var(--ty))
            rotate(var(--rotation));
    }
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.78);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 1000;
    padding: 20px;
}

.modal.active {
    opacity: 1;
    pointer-events: auto;
}

.modal-content {
    position: relative;
    width: min(500px, 90vw);
    padding: 35px 25px;
    border-radius: 22px;
    text-align: center;
    background: linear-gradient(135deg, #32194f, #15143e);
    border: 1px solid rgba(255, 120, 180, 0.4);
    box-shadow: 0 0 40px rgba(255, 80, 150, 0.4);
    transform: scale(0.8);
    transition: transform 0.4s ease;
}

.modal.active .modal-content {
    transform: scale(1);
}

.modal-content p {
    font-size: 18px;
    line-height: 1.6;
}

.modal-close {
    position: absolute;
    right: 12px;
    top: 8px;
    border: none;
    background: transparent;
    color: white;
    font-size: 28px;
    cursor: pointer;
}

/* =========================
   CONTROLES DE ZOOM
========================= */

.zoom-controls {
    position: fixed;
    right: 18px;
    bottom: 18px;
    display: flex;
    gap: 8px;
    z-index: 1100;
}

.zoom-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 90, 150, 0.75);
    color: white;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(255, 90, 150, 0.5);
}

.zoom-btn:active {
    transform: scale(0.9);
}

.zoom-level {
    position: fixed;
    right: 18px;
    bottom: 70px;
    padding: 5px 10px;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.6);
    font-size: 12px;
    z-index: 1100;
}

/* =========================
   TEXTO PRINCIPAL
========================= */

.love-title {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 50;
    width: 90%;
    pointer-events: none;
}

.love-title h1 {
    font-size: clamp(22px, 5vw, 38px);
    font-weight: normal;
    text-shadow:
        0 0 10px #ff80aa,
        0 0 25px #ff4080;
}

.love-title p {
    margin-top: 5px;
    font-size: 13px;
    opacity: 0.75;
}

/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .heart {
        width: 70px;
        height: 70px;
        left: -35px;
        top: -35px;
    }

    .heart::before,
    .heart::after {
        width: 70px;
        height: 70px;
    }

    .heart::before {
        top: -35px;
    }

    .heart::after {
        left: 35px;
    }

    .orbit {
        opacity: 0.75;
    }

    .planet-name {
        font-size: 9px;
    }

    .floating-phrase {
        font-size: 10px;
        width: 90px;
    }

    .love-title {
        top: 15px;
    }

    .love-title p {
        font-size: 11px;
    }

    .modal-content {
        padding: 35px 20px;
    }

    .modal-content p {
        font-size: 15px;
    }

    .zoom-controls {
        right: 10px;
        bottom: 10px;
    }

    .zoom-btn {
        width: 38px;
        height: 38px;
    }

    .zoom-level {
        right: 10px;
        bottom: 58px;
    }
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="love-title">
    <h1>❤️ Sistema Solar del Amor ❤️</h1>
    <p>Un pequeño universo creado para ti</p>
</div>

<div class="solar-system" id="solarSystem">

    <div class="sun">

        <div class="heart"></div>

        <div class="mini-heart"
             style="--x:-30px; --y:-80px;">❤</div>

        <div class="mini-heart"
             style="--x:40px; --y:-100px;">❤</div>

        <div class="mini-heart"
             style="--x:80px; --y:-30px;">❤</div>

        <div class="mini-heart"
             style="--x:-60px; --y:70px;">❤</div>

    </div>

    <div id="orbitsContainer"></div>

</div>

<div id="floatingPhrases"></div>

<div class="modal" id="modal">

    <div class="modal-content">

        <button class="modal-close" id="modalClose">
            ×
        </button>

        <p id="modalText"></p>

    </div>

</div>

<div class="zoom-controls">

    <button class="zoom-btn" id="zoomOut">
        −
    </button>

    <button class="zoom-btn" id="zoomIn">
        +
    </button>

</div>

<div class="zoom-level" id="zoomLevel">
    Zoom: 100%
</div>

<script>

/* =========================
   ESTRELLAS
========================= */

function createStars() {

    const container = document.getElementById("stars");

    for (let i = 0; i < 180; i++) {

        const star = document.createElement("div");

        star.className = "star";

        const size = Math.random() * 3 + 1;

        star.style.width = size + "px";
        star.style.height = size + "px";

        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";

        star.style.animationDuration =
            (Math.random() * 4 + 2) + "s";

        star.style.animationDelay =
            Math.random() * 5 + "s";

        container.appendChild(star);
    }
}


/* =========================
   PLANETAS
========================= */

const planets = [

    {
        name: "Amor",
        size: 18,
        color: "#ff4d88",
        radius: 150,
        speed: 40,
        message:
        "Eres mi todo. Mi corazón siempre encuentra su camino hacia ti."
    },

    {
        name: "Pasión",
        size: 20,
        color: "#ff3366",
        radius: 220,
        speed: 34,
        message:
        "Mi corazón late con más fuerza cada vez que pienso en ti."
    },

    {
        name: "Ternura",
        size: 16,
        color: "#ff99cc",
        radius: 290,
        speed: 29,
        message:
        "Juntos por siempre. Cada pequeño momento contigo es especial."
    },

    {
        name: "Compromiso",
        size: 21,
        color: "#cc66ff",
        radius: 360,
        speed: 25,
        message:
        "Eres mi sueño hecho realidad y quiero seguir construyendo nuestra historia contigo."
    },

    {
        name: "Complicidad",
        size: 17,
        color: "#9966ff",
        radius: 430,
        speed: 21,
        message:
        "Contigo puedo reír, soñar y ser yo misma. Esa complicidad es uno de mis tesoros."
    },

    {
        name: "Respeto",
        size: 18,
        color: "#6699ff",
        radius: 500,
        speed: 17,
        message:
        "Nuestro amor crece cuando caminamos juntos, escuchándonos y respetándonos."
    },

    {
        name: "Confianza",
        size: 20,
        color: "#66ccff",
        radius: 570,
        speed: 13,
        message:
        "Eres mi refugio y la persona con quien quiero compartir mis días."
    },

    {
        name: "Eternidad",
        size: 23,
        color: "#ffcc66",
        radius: 640,
        speed: 9,
        message:
        "En este enorme universo, qué bonito haber encontrado nuestro propio pequeño universo."
    }

];


/* =========================
   CREAR ÓRBITAS
========================= */

function createSolarSystem() {

    const container =
        document.getElementById("orbitsContainer");

    planets.forEach((planet) => {

        /* Órbita */

        const orbit = document.createElement("div");

        orbit.className = "orbit";

        orbit.style.width =
            planet.radius * 2 + "px";

        orbit.style.height =
            planet.radius * 2 + "px";

        container.appendChild(orbit);


        /* Contenedor que gira */

        const orbitAnimation =
            document.createElement("div");

        orbitAnimation.className =
            "planet-orbit";

        orbitAnimation.style.width = "0";
        orbitAnimation.style.height = "0";

        orbitAnimation.style.animationDuration =
            planet.speed + "s";

        orbitAnimation.style.animationDelay =
            -(Math.random() * planet.speed) + "s";


        /* Planeta */

        const planetElement =
            document.createElement("div");

        planetElement.className = "planet";

        planetElement.style.setProperty(
            "--size",
            planet.size + "px"
        );

        planetElement.style.setProperty(
            "--radius",
            planet.radius + "px"
        );

        planetElement.style.setProperty(
            "--planet-color",
            planet.color
        );


        /* Nombre */

        const name =
            document.createElement("div");

        name.className = "planet-name";

        name.textContent = planet.name;

        planetElement.appendChild(name);


        /* Click */

        planetElement.addEventListener(
            "click",
            function() {

                showModal(planet.message);

            }
        );


        orbitAnimation.appendChild(
            planetElement
        );

        container.appendChild(
            orbitAnimation
        );

    });

}


/* =========================
   FRASES FLOTANTES
========================= */

const floatingPhrases = [

    "Eres mi universo",
    "Te amo más que ayer",
    "Nuestro amor es infinito",
    "Eres mi estrella favorita",
    "Mi corazón es tuyo",
    "Juntos somos más",
    "Eres mi destino",
    "Amor eterno",
    "Eres mi felicidad",
    "Tu amor es mi fuerza",
    "Eres mi refugio",
    "Amo cada parte de ti",
    "Mi amor por ti crece cada día",
    "Cada momento contigo es especial",
    "Eres mi persona favorita"

];


function createFloatingPhrases() {

    const container =
        document.getElementById(
            "floatingPhrases"
        );

    floatingPhrases.forEach(
        (phraseText, index) => {

            const phrase =
                document.createElement("div");

            phrase.className =
                "floating-phrase";

            phrase.textContent =
                phraseText;

            phrase.style.left =
                Math.random() * 85 + 5 + "%";

            phrase.style.top =
                Math.random() * 85 + 5 + "%";

            phrase.style.animationDuration =
                (12 + Math.random() * 12) + "s";

            phrase.style.animationDelay =
                (Math.random() * 10) + "s";

            container.appendChild(phrase);

        }
    );
}


/* =========================
   ESTRELLAS FUGACES
========================= */

const shootingPhrases = [

    "¡Eres increíble!",
    "Mi amor por ti brilla",
    "Eres mi deseo cumplido",
    "Eres mi constelación favorita",
    "Juntos somos magia",
    "Nuestro amor es cósmico",
    "Mi corazón orbita alrededor de ti",
    "Eres mi supernova"

];


function createShootingStar() {

    const star =
        document.createElement("div");

    star.className =
        "shooting-star";

    star.textContent =
        shootingPhrases[
            Math.floor(
                Math.random() *
                shootingPhrases.length
            )
        ];

    const colors = [
        "#ff6b9d",
        "#ffcc66",
        "#66ccff",
        "#cc99ff",
        "#ffffff"
    ];

    star.style.color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    star.style.left =
        Math.random() * 90 + "%";

    star.style.top =
        Math.random() * 80 + "%";

    const direction =
        Math.random() > 0.5 ? 1 : -1;

    star.style.setProperty(
        "--tx",
        direction *
        (100 + Math.random() * 150) +
        "vw"
    );

    star.style.setProperty(
        "--ty",
        (Math.random() * 80 - 40) +
        "vh"
    );

    star.style.setProperty(
        "--rotation",
        (Math.random() * 60 - 30) +
        "deg"
    );

    document.body.appendChild(star);

    setTimeout(
        () => star.remove(),
        5000
    );
}


setInterval(
    createShootingStar,
    4500
);


/* =========================
   MODAL
========================= */

function showModal(message) {

    document.getElementById(
        "modalText"
    ).textContent = message;

    document.getElementById(
        "modal"
    ).classList.add("active");

}


document.getElementById(
    "modalClose"
).addEventListener(
    "click",
    function() {

        document.getElementById(
            "modal"
        ).classList.remove("active");

    }
);


document.getElementById(
    "modal"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            this.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   ZOOM
========================= */

let currentZoom = 1;


function applyZoom() {

    const system =
        document.getElementById(
            "solarSystem"
        );

    system.style.transform =
        `translate(-50%, -50%) scale(${currentZoom})`;

    document.getElementById(
        "zoomLevel"
    ).textContent =
        "Zoom: " +
        Math.round(currentZoom * 100) +
        "%";
}


document.getElementById(
    "zoomIn"
).addEventListener(
    "click",
    function() {

        currentZoom =
            Math.min(
                2,
                currentZoom + 0.1
            );

        applyZoom();

    }
);


document.getElementById(
    "zoomOut"
).addEventListener(
    "click",
    function() {

        currentZoom =
            Math.max(
                0.55,
                currentZoom - 0.1
            );

        applyZoom();

    }
);


/* =========================
   RUEDA DEL RATÓN
========================= */

document.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        if (event.deltaY < 0) {

            currentZoom =
                Math.min(
                    2,
                    currentZoom + 0.1
                );

        } else {

            currentZoom =
                Math.max(
                    0.55,
                    currentZoom - 0.1
                );

        }

        applyZoom();

    },
    { passive: false }
);


/* =========================
   INICIAR
========================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        createStars();

        createSolarSystem();

        createFloatingPhrases();

        applyZoom();

    }
);

</script>

</body>
</html>
