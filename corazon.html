<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

body {
    background: #ffeef3;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.corazon {
    width: 100px;
    height: 100px;
    background: #ff4d6d;
    transform: rotate(-45deg);
    animation: latido 1s infinite;
}

.corazon::before,
.corazon::after {
    content: "";
    width: 100px;
    height: 100px;
    background: #ff4d6d;
    border-radius: 50%;
    position: absolute;
}

.corazon::before {
    top: -50px;
    left: 0;
}

.corazon::after {
    top: 0;
    left: 50px;
}

@keyframes latido {
    0%, 100% {
        transform: rotate(-45deg) scale(1);
    }

    50% {
        transform: rotate(-45deg) scale(1.15);
    }
}

</style>
</head>

<body>

<div class="corazon"></div>

</body>
</html>
